<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>RSVP | Med & Jean</title>

<link
  href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=DM+Sans:wght@400;500;600&family=La+Belle+Aurore&display=swap"
  rel="stylesheet"
>

<style>

:root {

  --cream:#fbf7ef;
  --paper:#fffdf8;

  --ink:#4e4943;
  --muted:#8c8278;

  --yellow:#f5df91;
  --blue:#b9d9e8;
  --pink:#edc4ca;
  --violet:#cbbfdf;

  --brown:#756451;
  --line:#ded5ca;

}


* {
  box-sizing:border-box;
}


body {

  margin:0;

  min-height:100vh;

  padding:25px;

  background:

    radial-gradient(
      circle at 10% 10%,
      rgba(245,223,145,.35),
      transparent 25%
    ),

    radial-gradient(
      circle at 90% 20%,
      rgba(185,217,232,.35),
      transparent 25%
    ),

    radial-gradient(
      circle at 15% 90%,
      rgba(237,196,202,.30),
      transparent 25%
    ),

    var(--cream);

  color:var(--ink);

  font-family:
    "DM Sans",
    Arial,
    sans-serif;

  overflow-x:hidden;

}


/* =========================================
   DECORATION
========================================= */

.flight-path {

  position:fixed;

  width:180px;

  height:100px;

  border-top:
    2px dashed
    rgba(117,100,81,.25);

  border-radius:50%;

  pointer-events:none;

  z-index:0;

}


.flight-path.one {

  top:8%;

  left:-50px;

  transform:rotate(15deg);

}


.flight-path.two {

  bottom:8%;

  right:-60px;

  transform:rotate(-15deg);

}


.plane {

  position:fixed;

  font-size:22px;

  z-index:1;

  opacity:.55;

  pointer-events:none;

}


.plane.one {

  top:12%;

  left:12%;

  transform:rotate(-15deg);

}


.plane.two {

  bottom:13%;

  right:12%;

  transform:rotate(165deg);

}


/* =========================================
   CONTAINER
========================================= */

.container {

  position:relative;

  z-index:2;

  width:100%;

  max-width:680px;

  margin:0 auto;

}


/* =========================================
   PASSPORT
========================================= */

.passport {

  background:var(--paper);

  border:
    1px solid
    rgba(117,100,81,.20);

  border-radius:8px;

  padding:18px;

  box-shadow:
    0 20px 60px
    rgba(90,70,50,.12);

  position:relative;

}


.passport-inner {

  border:
    1px dashed
    rgba(117,100,81,.35);

  padding:45px 30px;

  position:relative;

  overflow:hidden;

}


/* =========================================
   CORNERS
========================================= */

.corner {

  position:absolute;

  width:80px;

  height:80px;

  border:
    1px solid
    rgba(117,100,81,.15);

  border-radius:50%;

}


.corner.top-left {

  top:-45px;

  left:-45px;

  background:var(--yellow);

  opacity:.35;

}


.corner.top-right {

  top:-45px;

  right:-45px;

  background:var(--blue);

  opacity:.35;

}


.corner.bottom-left {

  bottom:-45px;

  left:-45px;

  background:var(--pink);

  opacity:.35;

}


.corner.bottom-right {

  bottom:-45px;

  right:-45px;

  background:var(--violet);

  opacity:.35;

}


/* =========================================
   HOMEPAGE
========================================= */

.eyebrow {

  text-align:center;

  font-family:
    "Cormorant Garamond",
    Georgia,
    serif;

  font-size:42px;

  font-weight:500;

  line-height:1.15;

  letter-spacing:2px;

  text-transform:uppercase;

  color:var(--brown);

  margin-bottom:20px;

}


.journey {

  text-align:center;

  font-family:
    "DM Sans",
    Arial,
    sans-serif;

  font-size:17px;

  line-height:1.7;

  color:var(--muted);

  max-width:520px;

  margin:0 auto;

}


.route {

  display:flex;

  align-items:center;

  gap:10px;

  margin:30px 0;

  color:var(--muted);

  font-size:13px;

}


.route-line {

  flex:1;

  border-top:
    1px dashed
    var(--line);

}


.instruction {

  text-align:center;

  font-family:
    "Cormorant Garamond",
    Georgia,
    serif;

  font-size:26px;

  margin-bottom:8px;

}


.instruction-sub {

  text-align:center;

  color:var(--muted);

  font-size:13px;

  line-height:1.6;

  margin-bottom:22px;

}


.code-input {

  width:100%;

  padding:17px 15px;

  border:
    1px solid
    var(--line);

  border-radius:4px;

  background:#fffefa;

  font-family:
    "DM Sans",
    sans-serif;

  font-size:19px;

  text-align:center;

  letter-spacing:5px;

  color:var(--ink);

  outline:none;

  text-transform:uppercase;

}


.code-input:focus {

  border-color:var(--violet);

  box-shadow:
    0 0 0 4px
    rgba(203,191,223,.20);

}


/* =========================================
   BUTTON
========================================= */

.main-button {

  width:100%;

  margin-top:13px;

  padding:16px;

  border:none;

  border-radius:4px;

  background:var(--brown);

  color:white;

  font-family:
    "DM Sans",
    sans-serif;

  font-size:13px;

  letter-spacing:1px;

  cursor:pointer;

  transition:
    transform .2s,
    background .2s;

}


.main-button:hover {

  background:#625342;

  transform:translateY(-1px);

}


.main-button:disabled {

  opacity:.55;

  cursor:not-allowed;

  transform:none;

}


/* =========================================
   INVITATION
========================================= */

.invitation {

  margin-top:5px;

}


.destination-label {

  text-align:center;

  font-family:
    "Cormorant Garamond",
    Georgia,
    serif;

  font-size:11px;

  font-weight:500;

  letter-spacing:3px;

  text-transform:uppercase;

  color:var(--muted);

  margin-bottom:4px;

}


.destination {

  text-align:center;

  font-family:
    "Cormorant Garamond",
    Georgia,
    serif;

  font-size:36px;

  margin:5px 0 25px;

}


.guest {

  padding:20px 5px;

  border-top:
    1px solid
    #eee7df;

}


.guest-name {

  font-family:
    "Cormorant Garamond",
    Georgia,
    serif;

  font-size:22px;

  margin-bottom:14px;

}


.choices {

  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:10px;

}


.choice {

  border:
    1px solid
    var(--line);

  padding:13px 8px;

  text-align:center;

  font-size:11px;

  letter-spacing:.5px;

  cursor:pointer;

  border-radius:3px;

  transition:all .2s;

  background:#fffefa;

}


.choice:hover {

  border-color:var(--brown);

}


.choice.selected.attending {

  background:var(--blue);

  border-color:var(--blue);

  color:#405d68;

}


.choice.selected.declining {

  background:var(--pink);

  border-color:var(--pink);

  color:#76565b;

}


/* =========================================
   COMPLETED RSVP / DESTINATIONS
========================================= */

.completed-message {

  text-align:center;

  color:var(--muted);

  font-size:13px;

  line-height:1.7;

  max-width:500px;

  margin:0 auto 28px;

}


.completed-title {

  font-family:
    "Cormorant Garamond",
    Georgia,
    serif;

  font-size:31px;

  color:var(--ink);

  margin-bottom:10px;

}


.completed-guest {

  margin-bottom:18px;

  padding:22px 14px;

  border:
    1px solid
    rgba(117,100,81,.15);

  background:

    linear-gradient(
      135deg,
      rgba(245,223,145,.12),
      rgba(185,217,232,.12),
      rgba(203,191,223,.10)
    );

  border-radius:4px;

}


.completed-guest-name {

  font-family:
    "Cormorant Garamond",
    Georgia,
    serif;

  font-size:22px;

  margin-bottom:5px;

}


.completed-status {

  font-size:10px;

  letter-spacing:1.5px;

  text-transform:uppercase;

  color:#6d8674;

  margin-bottom:14px;

}


.completed-destination-label {

  font-size:9px;

  letter-spacing:2.5px;

  text-transform:uppercase;

  color:var(--muted);

  margin-bottom:3px;

}


.completed-destination {

  font-family:
    "Cormorant Garamond",
    Georgia,
    serif;

  font-size:40px;

  font-weight:600;

  line-height:1.05;

  color:var(--brown);

}


.completed-note {

  text-align:center;

  color:var(--muted);

  font-size:11px;

  line-height:1.7;

  font-style:italic;

  margin:
    25px auto 0;

  max-width:470px;

}


/* =========================================
   DESTINATION GROUP
========================================= */

.destination-group {

  margin-bottom:18px;

  padding:24px 15px;

  border:
    1px solid
    rgba(117,100,81,.15);

  background:

    linear-gradient(
      135deg,
      rgba(245,223,145,.12),
      rgba(185,217,232,.12),
      rgba(203,191,223,.10)
    );

  border-radius:4px;

}


.destination-passengers {

  display:flex;

  flex-wrap:wrap;

  justify-content:center;

  gap:5px 16px;

  margin-bottom:15px;

}


.destination-passenger {

  font-family:
    "Cormorant Garamond",
    Georgia,
    serif;

  font-size:20px;

  color:var(--ink);

  text-align:center;

}


.destination-name {

  text-align:center;

  font-family:
    "Cormorant Garamond",
    Georgia,
    serif;

  font-size:42px;

  font-weight:600;

  line-height:1.05;

  color:var(--brown);

}


.destination-note {

  text-align:center;

  color:var(--muted);

  font-size:11px;

  line-height:1.6;

  margin-top:18px;

  font-style:italic;

}


/* =========================================
   ERROR
========================================= */

.error {

  text-align:center;

  color:#a16060;

  font-size:13px;

  line-height:1.6;

  margin-top:15px;

}


/* =========================================
   FOOTER
========================================= */

.footer {

  text-align:center;

  margin-top:18px;

  color:var(--muted);

  font-size:10px;

  letter-spacing:2px;

  text-transform:uppercase;

  line-height:1.8;

}


.footer-hashtag {

  display:block;

  letter-spacing:1.2px;

  text-transform:none;

  margin-top:2px;

}


/* =========================================
   MOBILE
========================================= */

@media (max-width:520px) {

  body {
    padding:12px;
  }


  .passport {
    padding:10px;
  }


  .passport-inner {
    padding:35px 18px;
  }


  .eyebrow {
    font-size:34px;
  }


  .journey {
    font-size:17px;
  }


  .choices {
    grid-template-columns:1fr;
  }


  .destination-label {
    font-size:10px;
  }


  .destination {
    font-size:31px;
  }


  .completed-destination {
    font-size:36px;
  }


  .destination-passenger {
    font-size:19px;
  }

}

</style>

</head>


<body>


<div class="flight-path one"></div>

<div class="flight-path two"></div>

<div class="plane one">✈</div>

<div class="plane two">✈</div>


<div class="container">


<div class="passport">


<div class="passport-inner">


<div class="corner top-left"></div>

<div class="corner top-right"></div>

<div class="corner bottom-left"></div>

<div class="corner bottom-right"></div>


<!-- =====================================
     HOMEPAGE
====================================== -->

<div id="welcome">


<div class="eyebrow">

WELCOME ABOARD

</div>


<div class="journey">

Every great journey is made more special
with the people we love along the way.
Come celebrate with us as we begin our
journey to forever.

</div>


<div class="route">

<span>✈</span>

<div class="route-line"></div>

<span>♡</span>

<div class="route-line"></div>

<span>✈</span>

</div>


<div class="instruction">

Your invitation awaits.

</div>


<div class="instruction-sub">

Enter your private RSVP code below.

</div>


<input

id="codeInput"

class="code-input"

type="text"

placeholder="RSVP CODE"

autocomplete="off"

>


<button

id="findButton"

class="main-button"

onclick="findInvitation()"

>

CHECK IN &nbsp; ✈

</button>


<div id="searchMessage"></div>


</div>


<div id="result"></div>


</div>

</div>


<div class="footer">

<div>

Med &amp; Jean • 02.12.27

</div>


<span class="footer-hashtag">

#oriJEANallyMEDforeachother

</span>


</div>


</div>



<script>


const API_URL =
"https://script.google.com/macros/s/AKfycbw7_rvyadRRuvjjylNuqP7VN4CMR1ml4c3HUYPoEWTysGKHWYgOaVbhxgnPhDmKfULO/exec";


const WEDDING_WEBSITE =
"https://giraffe-ytb0lv.my.canva.site/";


let currentCode = "";

let currentInvitation = null;

let responses = {};



/* =========================================
   FIND INVITATION
========================================= */

async function findInvitation() {


const input =

document
.getElementById("codeInput")
.value
.trim()
.toUpperCase();


const message =

document
.getElementById("searchMessage");


const button =

document
.getElementById("findButton");


if (!input) {


message.innerHTML = `

<div class="error">

Please enter your RSVP code.

</div>

`;

return;

}


button.disabled = true;

button.textContent =
"CHECKING...";


message.innerHTML = "";


try {


const response =

await fetch(

API_URL,

{

method:"POST",

headers:{

"Content-Type":
"text/plain;charset=utf-8"

},

body:JSON.stringify({

action:"findInvitation",

code:input

})

}

);


const data =
await response.json();


if (!data.found) {


message.innerHTML = `

<div class="error">

We couldn't find that RSVP code.<br>

Please check your code and try again.

</div>

`;

return;

}


currentCode = input;

currentInvitation = data;


showInvitation(data);


}


catch(error) {


console.error(error);


message.innerHTML = `

<div class="error">

Something went wrong.<br>

Please try again.

</div>

`;

}


finally {


button.disabled = false;

button.textContent =
"CHECK IN ✈";

}

}



/* =========================================
   SHOW INVITATION
========================================= */

function showInvitation(data) {


document
.getElementById("welcome")
.style.display = "none";


const result =

document
.getElementById("result");


responses = {};


/*
 * Check whether EVERY guest has
 * already submitted an RSVP.
 */

const allCompleted =

data.guests.length > 0 &&

data.guests.every(
function(guest) {

return (
guest.status === "Attending" ||
guest.status === "Declining"
);

}
);


/*
 * If everyone is completed,
 * show the final destination page.
 */

if (allCompleted) {

showCompletedInvitation(data);

return;

}


/*
 * Otherwise show the normal RSVP
 * page for guests who still need
 * to respond.
 */

showPendingInvitation(data);

}



/* =========================================
   PENDING RSVP PAGE
========================================= */

function showPendingInvitation(data) {


let guestHTML = "";


data.guests.forEach(

function(guest,index) {


/*
 * Guests who already responded
 * are displayed as completed.
 */

if (
guest.status === "Attending" ||
guest.status === "Declining"
) {


const statusClass =
guest.status === "Attending"
? "attending"
: "declining";


guestHTML += `

<div class="guest">

<div class="guest-name">

${escapeHTML(guest.name)}

</div>

<div
style="
text-align:center;
font-size:12px;
color:#8c8278;
padding:10px;
"
>

Already confirmed:

<strong
class="${statusClass}"
>

${escapeHTML(guest.status)}

</strong>

</div>

</div>

`;


responses[index] = null;


return;

}


responses[index] = null;


guestHTML += `

<div class="guest">


<div class="guest-name">

${escapeHTML(guest.name)}

</div>


<div class="choices">


<div

class="choice"

id="attending-${index}"

onclick="chooseResponse(
${index},
'Attending'
)"

>

🛫 &nbsp;
YES, I'M COMING

</div>


<div

class="choice"

id="declining-${index}"

onclick="chooseResponse(
${index},
'Declining'
)"

>

🛬 &nbsp;
SORRY, I CAN'T MAKE IT

</div>


</div>

</div>

`;

}

);


document
.getElementById("result")
.innerHTML = `

<div class="invitation">


<div class="destination-label">

YOUR DESTINATION

</div>


<div class="destination">

Med &amp; Jean Wedding

</div>


<div

class="journey"

style="
font-size:13px;
line-height:1.65;
margin-bottom:28px;
"

>

To keep things simple, you can confirm the RSVP
just for yourself or for everyone included in your
invitation. Just make sure the response you select
is accurate for each guest.

<br><br>

If anything in the list doesn’t look right, or if you
have any questions, please feel free to reach out to us.

</div>


${guestHTML}


<button

id="submitButton"

class="main-button"

onclick="submitRSVP()"

>

CHECK IN &nbsp; ✈

</button>


<button

class="main-button"

style="
background:transparent;
color:#756451;
border:1px solid #ded5ca;
"

onclick="startOver()"

>

← BACK

</button>


</div>

`;

}



/* =========================================
   COMPLETED RSVP PAGE
========================================= */

function showCompletedInvitation(data) {


let destinationHTML = "";


/*
 * Show each guest separately because
 * guests in the same group can have
 * different destinations.
 */

data.guests.forEach(

function(guest) {


const statusClass =
guest.status === "Attending"
? "attending"
: "declining";


/*
 * If someone is declining, they can
 * still be shown as confirmed but their
 * destination is not useful as a seat.
 */

if (
guest.status === "Declining"
) {


destinationHTML += `

<div class="completed-guest">

<div class="completed-guest-name">

${escapeHTML(guest.name)}

</div>


<div class="completed-status">

RSVP CONFIRMED • NOT ATTENDING

</div>


<div
style="
font-size:12px;
color:#8c8278;
"
>

We’ll miss you and hope to celebrate
with you another time. 🤍

</div>

</div>

`;


return;

}


/*
 * Attending guest.
 */

destinationHTML += `

<div class="completed-guest">

<div class="completed-guest-name">

${escapeHTML(guest.name)}

</div>


<div class="completed-status">

RSVP CONFIRMED • ATTENDING

</div>


<div class="completed-destination-label">

YOUR DESTINATION

</div>


<div class="completed-destination">

${
guest.destination
? escapeHTML(guest.destination)
: "Assigned on the day"
}

</div>

</div>

`;

}

);


document
.getElementById("result")
.innerHTML = `

<div class="invitation">


<div class="destination-label">

YOUR DESTINATION

</div>


<div class="destination">

Med &amp; Jean Wedding

</div>


<div class="completed-title">

You're all checked in!

</div>


<div class="completed-message">

Thank you for confirming your RSVP.
Your responses have been recorded.

<br><br>

Below are the assigned tables for
everyone in your invitation.

</div>


${destinationHTML}


<div class="completed-note">

Your assigned destination is your table assignment
for the celebration. If there are any changes to your
RSVP, or if anything looks incorrect, please contact us.

</div>


<a

href="${WEDDING_WEBSITE}"

target="_blank"

rel="noopener noreferrer"

class="main-button"

style="
display:block;
text-decoration:none;
margin-top:28px;
"

>

GO BACK TO OUR WEDDING WEBSITE

</a>


<button

class="main-button"

style="
background:transparent;
color:#756451;
border:1px solid #ded5ca;
"

onclick="startOver()"

>

← BACK

</button>


</div>

`;

}



/* =========================================
   CHOOSE RESPONSE
========================================= */

function chooseResponse(
index,
response
) {


responses[index] = response;


const attending =

document.getElementById(
`attending-${index}`
);


const declining =

document.getElementById(
`declining-${index}`
);


if (!attending || !declining) {
return;
}


attending.classList.remove(
"selected",
"attending"
);


declining.classList.remove(
"selected",
"declining"
);


if (response === "Attending") {


attending.classList.add(
"selected",
"attending"
);

}


if (response === "Declining") {


declining.classList.add(
"selected",
"declining"
);

}

}



/* =========================================
   SUBMIT RSVP
========================================= */

async function submitRSVP() {


const guests =
currentInvitation.guests;


/*
 * Only guests who actually selected
 * a response are included.
 */

const responseData =

guests

.map(function(guest,index) {


if (!responses[index]) {

return null;

}


return {

name:
guest.name,

response:
responses[index]

};

})


.filter(function(response) {

return response !== null;

});


if (responseData.length === 0) {


alert(

"Please select a response for at least one guest."

);


return;

}


const button =

document.getElementById(
"submitButton"
);


button.disabled = true;

button.textContent =
"CHECKING YOU IN...";


try {


const response =

await fetch(

API_URL,

{

method:"POST",

headers:{

"Content-Type":
"text/plain;charset=utf-8"

},

body:JSON.stringify({

action:"submitRSVP",

code:currentCode,

responses:responseData

})

}

);


const data =
await response.json();


if (!data.success) {


alert(

data.error ||
"Something went wrong."

);


button.disabled = false;

button.textContent =
"CHECK IN ✈";


return;

}


/*
 * Important:
 *
 * Fetch the invitation again after
 * submitting so the page immediately
 * knows which guests are now complete.
 */

const refreshedResponse =

await fetch(

API_URL,

{

method:"POST",

headers:{

"Content-Type":
"text/plain;charset=utf-8"

},

body:JSON.stringify({

action:"findInvitation",

code:currentCode

})

}

);


const refreshedData =
await refreshedResponse.json();


if (
refreshedData.success &&
refreshedData.found
) {


currentInvitation =
refreshedData;


/*
 * If everyone is now complete,
 * immediately show their destinations.
 */

if (
refreshedData.guests.length > 0 &&
refreshedData.guests.every(
function(guest) {

return (
guest.status === "Attending" ||
guest.status === "Declining"
);

}
)
) {

showCompletedInvitation(
refreshedData
);

return;

}

}


/*
 * Otherwise show the regular
 * success message for a partial RSVP.
 */

showPartialSuccess();


}


catch(error) {


console.error(error);


alert(

"We couldn't submit your RSVP. Please try again."

);


button.disabled = false;

button.textContent =
"CHECK IN ✈";

}

}

/* =========================================
   ESCAPE HTML
========================================= */

function escapeHTML(value) {


return String(value)

.replace(
/&/g,
"&amp;"
)

.replace(
/</g,
"&lt;"
)

.replace(
/>/g,
"&gt;"
)

.replace(
/"/g,
"&quot;"
)

.replace(
/'/g,
"&#039;"
);

}
